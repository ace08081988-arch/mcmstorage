name: request-list-titles-selesai-scope

on:
  push:
    paths:
      - "supabase/migrations/**.sql"
      - "supabase/tests/request_list_titles_selesai_scope.sql"
      - ".github/workflows/request-list-titles-selesai-scope.yml"
  pull_request:
    paths:
      - "supabase/migrations/**.sql"
      - "supabase/tests/request_list_titles_selesai_scope.sql"
      - ".github/workflows/request-list-titles-selesai-scope.yml"
  workflow_dispatch:

jobs:
  run-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
      - name: Run request_list_titles_via_task regression
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" \
            -f supabase/tests/request_list_titles_selesai_scope.sql