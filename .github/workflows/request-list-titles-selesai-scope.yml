name: request_list_titles_via_task – Selesai scope regression

on:
  push:
    paths:
      - "supabase/migrations/**.sql"
      - "supabase/tests/request_list_titles_selesai_scope.sql"
      - ".github/workflows/request-list-titles-selesai-scope.yml"
  pull_request:
    paths:
      - "supabase/migrations/**.sql"
      - "supabase/tests/request_list_titles_selesai_scope.sql"
      - ".github/workflows/request-list-titles-selesai-scope.yml"
  workflow_dispatch:

jobs:
  run-sql:
    runs-on: ubuntu-latest
    if: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run request_list_titles_via_task regression
        env:
          PGPASSWORD_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql -v ON_ERROR_STOP=1 "$PGPASSWORD_URL" \
            -f supabase/tests/request_list_titles_selesai_scope.sql