name: Chat Deleted Snapshot Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chat-deleted-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run chat-deleted unit, UI, and snapshot tests
        run: bun run test:chat-deleted

      - name: Upload Vitest snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-deleted-snapshot-diffs
          path: |
            src/lib/__snapshots__/**
            src/lib/**/*.snap
          retention-days: 14