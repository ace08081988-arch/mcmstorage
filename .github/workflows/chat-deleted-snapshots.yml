name: Chat Deleted Snapshot Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chat-deleted-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run chat-deleted unit, UI, and snapshot tests
        env:
          CI: "true"
        # Vitest in CI mode fails (instead of silently writing) when a
        # snapshot is missing or differs. Output is captured for the diff
        # artifact below.
        run: |
          mkdir -p artifacts
          bun run test:chat-deleted -- --reporter=verbose --no-color 2>&1 | tee artifacts/vitest-output.log

      - name: Capture snapshot diff vs committed baseline
        if: failure()
        run: |
          mkdir -p artifacts
          git diff --no-color -- 'src/lib/**/__snapshots__/**' 'src/lib/**/*.snap' \
            > artifacts/snapshot.diff || true
          git status --porcelain -- 'src/lib/**/__snapshots__/**' 'src/lib/**/*.snap' \
            > artifacts/snapshot.status || true
          # Surface MessagePreview / DeletedPreview blocks specifically.
          grep -n -A 20 -E 'MessagePreview|DeletedPreview' artifacts/snapshot.diff \
            > artifacts/snapshot.message-deleted-preview.diff || true

      - name: Upload Vitest snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-deleted-snapshot-diffs
          path: |
            artifacts/**
            src/lib/__snapshots__/**
            src/lib/**/*.snap
          retention-days: 14