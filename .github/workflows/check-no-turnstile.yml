name: check-no-turnstile

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-no-turnstile:
    name: Reject reintroduced Turnstile references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run guard
        run: node scripts/check-no-turnstile.mjs