name: MCM Storage Play Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build signed AAB only, without calling Google Play API"
        type: boolean
        default: true
      track:
        description: "Google Play testing track (production is intentionally unavailable)"
        type: choice
        default: internal
        options: [internal, alpha, beta]
      release_status:
        description: "Google Play release status"
        type: choice
        default: draft
        options: [draft, inProgress, halted, completed]
      skip_version_check:
        description: "Skip remote versionCode check when uploading"
        type: boolean
        default: false
      expected_version_code:
        description: "Optional expected versionCode"
        type: string
        default: ""
      expected_version_name:
        description: "Optional expected versionName"
        type: string
        default: ""
  push:
    branches: ["Mcmstorage.biz"]
    paths:
      - ".github/workflows/mcm-storage-play-release.yml"
      - "scripts/build-aab.mjs"
      - "scripts/preflight-release.mjs"
      - "scripts/sync-native.mjs"
      - "tests/integration/android-package-separation.test.ts"
      - "capacitor.config.ts"
      - "android/**"
      - "package.json"
      - "bun.lock"

concurrency:
  group: mcm-storage-play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: MCM Storage signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
      KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
      PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
      UPLOAD_PLAY_SUMMARY_JSON: ${{ github.workspace }}/dist/upload-play-summary.json
      BUNDLETOOL_JAR: ${{ github.workspace }}/.cache/bundletool.jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate inputs and required secrets
        env:
          KEYSTORE_BASE64_VALUE: ${{ secrets.KEYSTORE_BASE64 }}
          FIREBASE_CONFIG_VALUE: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_BASE64_VALUE:-}" ] || missing+=(KEYSTORE_BASE64)
          [ -n "${KEYSTORE_ALIAS:-}" ] || missing+=(KEYSTORE_ALIAS)
          [ -n "${KEYSTORE_STORE_PASS:-}" ] || missing+=(KEYSTORE_STORE_PASS)
          [ -n "${KEYSTORE_KEY_PASS:-}" ] || missing+=(KEYSTORE_KEY_PASS)
          [ -n "${FIREBASE_CONFIG_VALUE:-}" ] || missing+=(GOOGLE_SERVICES_JSON_B64)
          if [ "$DRY_RUN" != "true" ]; then
            [ -n "${PLAY_SERVICE_ACCOUNT_JSON_B64:-}" ] || missing+=(PLAY_SERVICE_ACCOUNT_JSON_B64)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing required secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Materialize release credentials
        env:
          KEYSTORE_BASE64_VALUE: ${{ secrets.KEYSTORE_BASE64 }}
          FIREBASE_CONFIG_VALUE: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64_VALUE" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 --decode > android/mcm.keystore
          printf '%s' "$FIREBASE_CONFIG_VALUE" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 --decode > android/app/google-services.json
          test -s android/mcm.keystore || { echo '::error::KEYSTORE_BASE64 decoded to an empty file'; exit 1; }
          node -e 'const j=require("./android/app/google-services.json"); const p=(j.client||[]).map(c=>c?.client_info?.android_client_info?.package_name); if(!p.includes("mcmstorage.app")||p.some(x=>x!=="mcmstorage.app")){throw new Error(`Firebase clients must contain only mcmstorage.app; found: ${p.join(", ")||"none"}`)}'
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/mcm.keystore
          keyAlias=$KEYSTORE_ALIAS
          EOF

      - name: Install bundletool
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 --output "$BUNDLETOOL_JAR" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Validate version
        id: appver
        env:
          EXPECTED_VC: ${{ inputs.expected_version_code || '' }}
          EXPECTED_VN: ${{ inputs.expected_version_name || '' }}
        run: |
          set -euo pipefail
          VC=$(node scripts/read-app-version.mjs --field versionCode)
          VN=$(node scripts/read-app-version.mjs --field versionName)
          [ -z "$EXPECTED_VC" ] || [ "$EXPECTED_VC" = "$VC" ] || { echo "::error::Expected versionCode $EXPECTED_VC, found $VC"; exit 1; }
          [ -z "$EXPECTED_VN" ] || [ "$EXPECTED_VN" = "$VN" ] || { echo "::error::Expected versionName $EXPECTED_VN, found $VN"; exit 1; }
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"

      - name: Validate workflow and package invariants
        run: |
          bunx vitest run tests/integration/android-package-separation.test.ts
          bunx tsc --noEmit
          node scripts/validate-keystore.mjs --non-interactive
          node scripts/preflight-release.mjs

      - name: Build signed MCM Storage AAB
        id: release
        env:
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
          TRACK: ${{ inputs.track || 'internal' }}
          RELEASE_STATUS: ${{ inputs.release_status || 'draft' }}
          SKIP_VERSION_CHECK: ${{ inputs.skip_version_check || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/build-aab.mjs
          else
            args=(--upload --upload-track "$TRACK" --release-status "$RELEASE_STATUS")
            [ "$SKIP_VERSION_CHECK" = "true" ] && args+=(--skip-version-check)
            node scripts/build-aab.mjs "${args[@]}"
          fi

      - name: Verify and checksum release artifact
        run: |
          set -euo pipefail
          node scripts/preflight-release.mjs --post
          sha256sum dist/aab/*.aab | tee dist/aab/SHA256SUMS.txt

      - name: Upload MCM Storage artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcm-storage-aab-${{ github.run_number }}
          path: |
            dist/aab/mcm-storage-${{ steps.appver.outputs.versionName }}-vc${{ steps.appver.outputs.versionCode }}-release.aab
            dist/aab/*.sha256
            dist/aab/SHA256SUMS.txt
            dist/mapping/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Release summary
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
          TRACK: ${{ inputs.track || 'internal' }}
          STATUS: ${{ inputs.release_status || 'draft' }}
        run: |
          {
            echo "# MCM Storage Play Release"
            echo ""
            echo "- Package: \`mcmstorage.app\`"
            echo "- Version: \`${{ steps.appver.outputs.versionName }}\` (\`${{ steps.appver.outputs.versionCode }}\`)"
            echo "- Mode: \`$([ "$DRY_RUN" = true ] && echo build-only || echo Play-upload)\`"
            echo "- Track/status: \`$TRACK\` / \`$STATUS\`"
            echo "- Artifact: \`mcm-storage-aab-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup sensitive files
        if: always()
        run: rm -f android/mcm.keystore android/keystore.properties android/app/google-services.json