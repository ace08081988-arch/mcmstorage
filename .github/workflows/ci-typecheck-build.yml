name: Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-typecheck-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: bunx tsgo --noEmit

      - name: Build (production)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}
        run: bun run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify on failure (open / update issue)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const author = commit.author?.login || commit.commit.author?.name || "unknown";
            const message = (commit.commit.message || "").split("\n")[0];
            const title = `CI gagal di main @ ${shortSha}`;
            const body = [
              `**Commit:** [\`${shortSha}\`](${commitUrl}) — ${message}`,
              `**Author:** @${author}`,
              `**Run:** ${runUrl}`,
              ``,
              `Workflow \`Typecheck & Build\` gagal pada push ke \`main\`. Periksa log run di atas untuk langkah yang gagal (typecheck atau build).`,
            ].join("\n");
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci-failure",
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci-failure"],
              });
            }

      - name: Job summary on failure
        if: failure()
        run: |
          {
            echo "## ❌ CI gagal";
            echo "";
            echo "- Commit: \`${GITHUB_SHA::7}\`";
            echo "- Ref: \`${GITHUB_REF}\`";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify WhatsApp on failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: |
          if [ -z "$WHATSAPP_TOKEN" ] || [ -z "$WHATSAPP_PHONE_ID" ] || [ -z "$WHATSAPP_RECIPIENTS" ]; then
            echo "WhatsApp secrets belum diset (WHATSAPP_TOKEN / WHATSAPP_PHONE_ID / WHATSAPP_RECIPIENTS) — lewati notifikasi."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="❌ CI gagal di main
          Commit: ${SHORT_SHA}
          Repo: ${GITHUB_REPOSITORY}
          Log: ${RUN_URL}"
          IFS=',' read -ra NUMBERS <<< "$WHATSAPP_RECIPIENTS"
          for raw in "${NUMBERS[@]}"; do
            to="$(echo "$raw" | tr -d ' +')"
            [ -z "$to" ] && continue
            echo "→ kirim ke ${to}"
            payload=$(jq -nc --arg to "$to" --arg body "$MSG" '{
              messaging_product:"whatsapp",
              to:$to,
              type:"text",
              text:{ preview_url:true, body:$body }
            }')
            http_code=$(curl -sS -o /tmp/wa-resp.json -w "%{http_code}" \
              -X POST "https://graph.facebook.com/v20.0/${WHATSAPP_PHONE_ID}/messages" \
              -H "Authorization: Bearer ${WHATSAPP_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" || echo "000")
            echo "   status=${http_code}"
            if [ "$http_code" != "200" ]; then
              echo "   respons: $(cat /tmp/wa-resp.json)"
            fi
          done