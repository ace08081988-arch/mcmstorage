name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Setiap hari 02:00 UTC — advisory baru bisa muncul tanpa ada commit.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: bun audit (high/critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit kompatibilitas versi router
        run: bun run audit:router-versions

      - name: Audit dependencies (fail on high/critical)
        run: bun run audit:deps:ci

      - name: Job summary on failure
        if: failure()
        run: |
          {
            echo "## ❌ Audit dependensi gagal";
            echo "";
            echo "Ada kerentanan **high/critical** pada dependensi.";
            echo "Naikkan versi paket di \`package.json\` (atau tambahkan \`overrides\`), lalu regenerasi \`bun.lock\`.";
            echo "";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "$GITHUB_STEP_SUMMARY"