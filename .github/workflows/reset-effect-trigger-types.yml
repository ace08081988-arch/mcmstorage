name: Reset-Effect-Trigger Types Guard

on:
  push:
    branches: [main]
    paths:
      - "src/routes/_authenticated.gudang*.ts"
      - "src/routes/_authenticated.gudang*.tsx"
      - "src/lib/beli-derived.ts"
      - "src/lib/beli-compute.ts"
      - "scripts/check-reset-effect-trigger-types.mjs"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/reset-effect-trigger-types.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/routes/_authenticated.gudang*.ts"
      - "src/routes/_authenticated.gudang*.tsx"
      - "src/lib/beli-derived.ts"
      - "src/lib/beli-compute.ts"
      - "scripts/check-reset-effect-trigger-types.mjs"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/reset-effect-trigger-types.yml"
  workflow_dispatch:

concurrency:
  group: reset-effect-trigger-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: TS7053 / indexing-type guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run guard
        run: bun run check:reset-effect-trigger-types

      - name: Job summary on failure
        if: failure()
        run: |
          {
            echo "## ❌ TS7053 / indexing-type regression";
            echo "";
            echo "Guard skrip \`scripts/check-reset-effect-trigger-types.mjs\` menemukan error indexing-type pada file yang dijaga (mis. \`reset-effect-trigger.test.ts\`).";
            echo "Perbaiki definisi tipe indexing (mis. \`keyof LifecycleState\`, cast eksplisit) sebelum menggabungkan PR ini.";
          } >> "$GITHUB_STEP_SUMMARY"