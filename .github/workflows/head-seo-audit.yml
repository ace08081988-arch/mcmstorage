name: Head & SEO Metadata Audit

# Gate wajib sebelum merge: audit snapshot tag head (favicon, apple-touch-icon,
# mask-icon, mstile, manifest, OG/Twitter card, cache-buster, header cache) plus
# audit metadata SEO per rute publik. Mismatch = merge/publish diblokir.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  head-seo-audit:
    name: Audit head & metadata SEO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Audit head (favicon, manifest, mstile, OG/Twitter, cache header)
        env:
          CI: "true"
        run: |
          mkdir -p artifacts
          bun run audit:head -- --reporter=verbose --no-color 2>&1 | tee artifacts/audit-head.log

      - name: Audit metadata SEO rute publik
        env:
          CI: "true"
        run: bun run audit:seo -- --reporter=verbose --no-color 2>&1 | tee artifacts/audit-seo.log

      - name: Audit cache-buster versi aset (og:image, ikon, manifest)
        env:
          CI: "true"
        run: bun run audit:asset-version 2>&1 | tee artifacts/audit-asset-version.log

      - name: Audit head terender (opsional, hanya bila AUDIT_BASE_URL diisi)
        if: env.AUDIT_BASE_URL != ''
        env:
          CI: "true"
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL }}
          AUDIT_MAX_URLS: ${{ vars.AUDIT_MAX_URLS || '20' }}
          AUDIT_TIMEOUT_MS: ${{ vars.AUDIT_TIMEOUT_MS || '10000' }}
          AUDIT_CONCURRENCY: ${{ vars.AUDIT_CONCURRENCY || '8' }}
          AUDIT_RETRIES: ${{ vars.AUDIT_RETRIES || '2' }}
          AUDIT_PER_PATTERN: ${{ vars.AUDIT_PER_PATTERN || '2' }}
        run: bun scripts/audit-rendered-head.ts --base "$AUDIT_BASE_URL" 2>&1 | tee artifacts/audit-head-live.log

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: head-seo-audit-log
          path: artifacts/**
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Head & SEO Metadata Audit";
            echo "";
            echo "- \`audit:head\` — tag head, manifest, ikon, cache-buster, header cache";
            echo "- \`audit:seo\` — title/description/OG/Twitter/canonical tiap rute publik";
            echo "- \`audit:head:live\` — pemindaian URL nyata (maks/timeout/paralel dapat diatur via vars AUDIT_*)";
            echo "- \`audit:asset-version\` — \`?v=\` og:image/ikon/manifest sinkron dengan BRAND_ASSET_VERSION";
          } >> "$GITHUB_STEP_SUMMARY"
