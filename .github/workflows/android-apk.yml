name: Android APK (manual)

# Build APK ACE STORAGE secara MANUAL saja. Tidak pernah berjalan otomatis
# pada push/PR. Tidak publish, tidak deploy, tidak upload ke Play Store.
# Keystore & password TIDAK pernah masuk repo — hanya GitHub Actions secrets
# yang dipakai secara ephemeral di runner lalu dihapus.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Jenis APK MCM Storage"
        type: choice
        default: debug
        options: [debug, release]
      version_name:
        description: "versionName (mis. 1.0.0)"
        type: string
        default: "1.0.0"
      version_code:
        description: "versionCode (bilangan bulat)"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: MCM Storage APK ${{ inputs.build_type }} ${{ inputs.version_name }} (${{ inputs.version_code }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validasi input
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in debug|release) ;; *) echo "build_type tidak valid"; exit 1 ;; esac
          echo "$VERSION_NAME" | grep -Eq '^[0-9A-Za-z._+-]{1,32}$' || { echo "version_name tidak valid"; exit 1; }
          echo "$VERSION_CODE" | grep -Eq '^[0-9]{1,9}$' || { echo "version_code harus angka"; exit 1; }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (production)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'placeholder' }}
        run: bun run build:mobile

      - name: Siapkan proyek Android (Capacitor 8, ephemeral)
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ]; then
            echo "android/ belum ada — generate lewat Capacitor"
            bunx cap add android
          fi
          bunx cap sync android

      - name: Patch versi & nama aplikasi
        run: |
          set -euo pipefail
          node scripts/patch-android-build.mjs \
            --app-name "MCM Storage" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE"

      - name: Validasi secrets signing (release, fail-closed)
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "${KEYSTORE_STORE_PASSWORD:-}" ] || missing="$missing KEYSTORE_STORE_PASSWORD"
          [ -n "${KEYSTORE_ALIAS:-}" ] || missing="$missing KEYSTORE_ALIAS"
          [ -n "${KEYSTORE_KEY_PASSWORD:-}" ] || missing="$missing KEYSTORE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets signing belum lengkap:$missing (pasang di GitHub → Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "Semua secret signing tersedia (nilai tidak ditampilkan)."

      - name: Decode keystore ke RUNNER_TEMP
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::Keystore hasil decode kosong/tidak valid"; exit 1; }

      - name: Gradle assembleDebug
        if: inputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Gradle assembleRelease (signed)
        if: inputs.build_type == 'release'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_TYPE: PKCS12
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Kumpulkan APK + checksum
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/qa
          if [ "$BUILD_TYPE" = "release" ]; then
            SRC="android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$SRC" || { echo "::error::APK tidak ditemukan di $SRC"; exit 1; }
          OUT="dist/qa/mcm-storage-${BUILD_TYPE}-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verifikasi tanda tangan APK
        run: |
          set -euo pipefail
          APK='${{ steps.collect.outputs.apk }}'
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner tidak ditemukan"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Ringkasan build
        run: |
          set -euo pipefail
          APK='${{ steps.collect.outputs.apk }}'
          {
            echo "## APK MCM Storage"
            echo ""
            echo "| Field | Nilai |"
            echo "| --- | --- |"
            echo "| Jenis build | \`$BUILD_TYPE\` |"
            echo "| Package | \`mcmstorage.app\` |"
            echo "| versionName | \`$VERSION_NAME\` |"
            echo "| versionCode | \`$VERSION_CODE\` |"
            echo "| File | \`$APK\` |"
            echo "| Ukuran | $(du -h "$APK" | cut -f1) |"
            echo ""
            echo '```'
            cat "$APK.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (APK + checksum)
        uses: actions/upload-artifact@v4
        with:
          name: mcm-storage-${{ inputs.build_type }}-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            dist/qa/*.apk
            dist/qa/*.apk.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Bersihkan keystore & file signing sementara
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.jks" || true
          rm -f android/keystore.properties android/key.properties || true