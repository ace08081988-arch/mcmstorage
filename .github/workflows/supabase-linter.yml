name: Supabase Security Linter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

jobs:
  validate-allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Skrip validator memakai `ajv`, jadi dependensi wajib terpasang dulu.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate allowlist schema (reason + category required, no duplicates)
        env:
          VALIDATE_ONLY: "1"
        run: node scripts/check-supabase-lints.mjs

  lint:
    runs-on: ubuntu-latest
    needs: validate-allowlist
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Supabase linter check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FAIL_ON_LEVEL: WARN
        run: node scripts/check-supabase-lints.mjs