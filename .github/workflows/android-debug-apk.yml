name: Android Debug APK (QA)

# Dry-run build untuk QA: menghasilkan APK debug yang bisa diunduh TANPA
# keystore release dan TANPA secret apa pun. Tidak pernah upload ke Play,
# tidak pernah menaikkan versionCode.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/build-apk.mjs"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

concurrency:
  group: mcm-storage-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: MCM Storage assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Versi aplikasi (read-only)
        run: node scripts/read-app-version.mjs

      - name: Typecheck
        run: bunx tsc --noEmit

      # Panggil vite langsung (bukan `bun run mobile:sync`) supaya hook
      # `prebuild` (audit SEO + vitest head-audit) tidak ikut jalan dan
      # menggagalkan build QA yang seharusnya hanya menghasilkan APK.
      - name: Build web (CAPACITOR_BUILD=1)
        env:
          CAPACITOR_BUILD: "1"
        run: |
          set -euo pipefail
          bunx vite build
          node scripts/prepare-capacitor-web.mjs

      - name: Verifikasi dist (index.html + viewport)
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html tidak ada"; exit 1; }
          grep -qia 'name="viewport"' dist/index.html || { echo "::error::meta viewport hilang — WebView akan blank/zoom"; exit 1; }
          echo "dist OK"

      - name: Sinkron native (cap sync android)
        run: |
          set -euo pipefail
          bunx cap sync android
          node scripts/sync-native.mjs

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Kumpulkan APK + checksum
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/qa
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          VC=$(node scripts/read-app-version.mjs --field versionCode)
          VN=$(node scripts/read-app-version.mjs --field versionName)
          OUT="dist/qa/mcm-storage-debug-${VN}-${VC}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > dist/qa/SHA256SUMS.txt
          SIZE=$(du -h "$OUT" | cut -f1)
          {
            echo "## 📱 Debug APK siap diunduh (QA)"
            echo ""
            echo "| Field | Nilai |"
            echo "| --- | --- |"
            echo "| Aplikasi | \`MCM Storage\` |"
            echo "| Package | \`mcmstorage.app\` |"
            echo "| versionName | \`$VN\` |"
            echo "| versionCode | \`$VC\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| File | \`$OUT\` |"
            echo "| Ukuran | $SIZE |"
            echo ""
            echo '```'
            cat dist/qa/SHA256SUMS.txt
            echo '```'
            echo ""
            echo "> Build DEBUG: ditandatangani debug keystore bawaan Android SDK, bukan keystore rilis. Jangan distribusikan ke publik."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcm-storage-debug-apk-${{ github.run_number }}
          path: |
            dist/qa/*.apk
            dist/qa/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # Artifact GitHub selalu terunduh sebagai .zip — di HP Android file itu
      # "tidak bisa dibuka". Karena itu APK yang sama juga dilampirkan ke
      # GitHub Release supaya bisa diunduh & dipasang langsung dari HP.
      - name: Publikasikan APK ke GitHub Release (tap langsung dari HP)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VC=$(node scripts/read-app-version.mjs --field versionCode)
          VN=$(node scripts/read-app-version.mjs --field versionName)
          TAG="qa-debug-${VC}-${{ github.run_number }}"
          gh release create "$TAG" dist/qa/*.apk dist/qa/SHA256SUMS.txt \
            --title "MCM Storage QA Debug $VN ($VC)" \
            --notes "Build DEBUG untuk QA. Uninstall dulu versi lama sebelum pasang." \
            --prerelease \
            --target "${{ github.sha }}"
          URL=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name|endswith(".apk")) | .url')
          {
            echo ""
            echo "### ⬇️ Link unduh langsung (tap dari HP)"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"

