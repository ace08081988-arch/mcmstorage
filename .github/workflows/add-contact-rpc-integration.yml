name: Integration — add_contact_by_invite_code

on:
  push:
    branches: [main]
    paths:
      - "tests/fixtures/add_contact_by_invite_code.sql"
      - "tests/integration/add-contact-by-invite-code-sql.test.ts"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - ".github/workflows/add-contact-rpc-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/fixtures/add_contact_by_invite_code.sql"
      - "tests/integration/add-contact-by-invite-code-sql.test.ts"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - ".github/workflows/add-contact-rpc-integration.yml"
  workflow_dispatch:

concurrency:
  group: add-contact-rpc-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Vitest integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bunx vitest run tests/integration

      - name: Job summary on failure
        if: failure()
        run: |
          {
            echo "## ❌ Integration tests gagal";
            echo "";
            echo "Perubahan pada \`add_contact_by_invite_code\` (fixture SQL / test / migrasi) memicu regresi.";
            echo "- Commit: \`${GITHUB_SHA::7}\`";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "$GITHUB_STEP_SUMMARY"