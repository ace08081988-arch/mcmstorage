name: Integration — add_contact_by_invite_code

on:
  push:
    branches: [main]
    paths:
      - "tests/fixtures/add_contact_by_invite_code.sql"
      - "tests/integration/add-contact-by-invite-code-sql.test.ts"
      - "tests/fixtures/message_delete_for_all.sql"
      - "tests/integration/message-delete-for-all-sql.test.ts"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - ".github/workflows/add-contact-rpc-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/fixtures/add_contact_by_invite_code.sql"
      - "tests/integration/add-contact-by-invite-code-sql.test.ts"
      - "tests/fixtures/message_delete_for_all.sql"
      - "tests/integration/message-delete-for-all-sql.test.ts"
      - "tests/integration/**"
      - "supabase/migrations/**"
      - ".github/workflows/add-contact-rpc-integration.yml"
  workflow_dispatch:

concurrency:
  group: add-contact-rpc-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Vitest integration (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests (shard ${{ matrix.shard }}/4)
        run: bunx vitest run tests/integration --shard=${{ matrix.shard }}/4

      - name: Job summary on failure
        if: failure()
        run: |
          {
            echo "## ❌ Integration tests gagal";
            echo "";
            echo "Perubahan pada \`add_contact_by_invite_code\` (fixture SQL / test / migrasi) memicu regresi.";
            echo "- Shard: \`${{ matrix.shard }}/4\`";
            echo "- Commit: \`${GITHUB_SHA::7}\`";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "$GITHUB_STEP_SUMMARY"

  integration-rollup:
    name: Vitest integration (rollup)
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any shard failed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Salah satu shard gagal: ${{ needs.integration.result }}" >&2
            exit 1
          fi